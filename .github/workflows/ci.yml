name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Générer le client Prisma
        run: pnpm prisma:generate
      - name: Vérifier les types
        run: pnpm typecheck
      - name: Linter
        run: pnpm lint
      - name: Tests unitaires
        run: pnpm test
      - name: Build
        run: pnpm build

  integration:
    runs-on: ubuntu-latest
    needs: qualite
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secondevie
          POSTGRES_PASSWORD: secondevie
          POSTGRES_DB: secondevie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secondevie -d secondevie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://secondevie:secondevie@localhost:5432/secondevie?schema=public
      JWT_SECRET: secret-de-ci-32-caracteres-minimum
      AUTH_CODE_PEPPER: code-pepper-de-ci-32-caracteres-minimum
      AUTH_REFRESH_PEPPER: refresh-pepper-de-ci-32-caracteres-minimum
      AUTH_RESET_PEPPER: reset-pepper-de-ci-32-caracteres-minimum
      EXPORT_SIGNING_SECRET: export-secret-de-ci-32-caracteres-minimum
      EXPORT_DIR: .exports-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Générer le client Prisma
        run: pnpm prisma:generate
      - name: Appliquer la migration sur PostgreSQL 16
        run: pnpm --filter @secondevie/api prisma:deploy
      - name: Tests d’intégration Testcontainers
        run: pnpm test:integration
